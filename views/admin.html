<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><title>Hangout admin</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app"></main>
<script>window.BASE = '__BASE__';</script>
<script src="/common.js"></script>
<script>
const app = document.getElementById('app');
let hangouts = [];
let drawOptsRef = () => {}; // set by editView so colorPicker can redraw the entry list
// replaceChildren() would stringify null and arrays, so flatten and skip them
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const show = (...kids) => app.replaceChildren(...kids.flat().filter((k) => k != null));

function loginView() {
  useLang('');
  const pw = el('input', { type: 'password', placeholder: t('adminPassword'), autocomplete: 'current-password', 'aria-label': t('adminPassword') });
  const err = el('p', { class: 'error' });
  const go = async () => {
    try { await api('POST', '/api/login', { password: pw.value }); await load(); }
    catch (e) { err.textContent = e.message; }
  };
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  show(el('h1', {}, t('adminTitle')),
    el('div', { class: 'card' }, pw, err, el('button', { onclick: go }, t('logIn'))));
  pw.focus();
}

async function load() {
  useLang(''); // list and login follow the browser; a hangout's editor uses that hangout's language
  try { hangouts = await api('GET', '/api/admin/hangouts'); listView(); }
  catch (e) { if (e.status === 401) loginView(); else app.textContent = e.message; }
}

// Raster images are scaled to fit 600x200 in the browser (keeps transparency) and returned as a data URL; SVG is passed through
async function scaleLogo(file) {
  if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) { // vector: sent as-is, the server sanitises it
    if (file.size > 200 * 1024) throw Object.assign(new Error(), { logoMsg: t('svgTooLarge') });
    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).replace(/^data:[^;]*;/, 'data:image/svg+xml;'));
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 600 / bmp.width, 200 / bmp.height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL('image/png');
  if (url.length > 900 * 1024) url = c.toDataURL('image/webp', 0.85);
  return url;
}

function listView() {
  document.title = t('adminTitle');
  show(
    el('div', { class: 'row spread' }, el('h1', {}, t('yourHangouts')),
      el('div', { class: 'row' },
        el('button', { onclick: () => editView(null) }, t('newHangout')),
        el('button', { class: 'secondary', onclick: async () => { await api('POST', '/api/logout'); loginView(); } }, t('logOut')))),
    hangouts.length ? null : el('p', { class: 'muted' }, t('noHangouts')),
    hangouts.map((p) => el('div', { class: 'card' },
      el('div', { class: 'row spread' },
        el('strong', {}, p.title, p.closed ? t('closedSuffix') : ''),
        el('span', { class: 'muted' }, t('responses', p.votes.length))),
      el('p', { class: 'link' }, el('a', { href: hangoutUrl(p.id), target: '_blank', rel: 'noopener' }, hangoutUrl(p.id))),
      el('div', { class: 'row' },
        el('button', { class: 'small', onclick: (e) => { navigator.clipboard.writeText(hangoutUrl(p.id)); e.target.textContent = t('copied'); } }, t('copyLink')),
        el('button', { class: 'small secondary', onclick: () => editView(p) }, t('edit'))))));
}

const EMOJIS = ['🎉','🥳','🎂','🍕','🍔','🍝','🍣','🥗','🍻','🍷','☕','🍰','🎬','🎮','🎲','🎵','🎤','📚','⚽','🏀','🎾','🏐','🏊','🚴','🏃','🥾','⛷️','🏔️','🏖️','🌞','⛅','🌧️','❄️','🌙','🌅','🔥','⭐','❤️','👍','👋','🙂','😎','🤝','🏠','🏢','🏫','🚗','🚆','✈️','🛒','💼','🧑‍🍳','🧹','🔧','🎁','📍','⏰','📅','✅','❓'];
const closeEmoji = () => document.querySelectorAll('.emoji-pop').forEach((p) => { p.hidden = true; });
document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-wrap')) closeEmoji(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEmoji(); });

// 😀 button + popover grid; inserts the chosen emoji at the cursor of the given input
function emojiPicker(input) {
  const pop = el('div', { class: 'emoji-pop', role: 'dialog', 'aria-label': t('pickEmoji'), hidden: true },
    EMOJIS.map((em) => el('button', { type: 'button', class: 'emoji', onclick: () => {
      const at = input.selectionStart == null ? input.value.length : input.selectionStart;
      input.setRangeText(em, at, input.selectionEnd == null ? at : input.selectionEnd, 'end');
      input.dispatchEvent(new Event('input'));
      pop.hidden = true;
    } }, em)));
  const btn = el('button', { type: 'button', class: 'small secondary', title: t('insertEmoji'), 'aria-label': t('insertEmoji'),
    onclick: () => { const open = pop.hidden; closeEmoji(); pop.hidden = !open; } }, '😀');
  return el('span', { class: 'emoji-wrap' }, btn, pop);
}

// 🎨 button + swatch popover: optional highlight colour for one entry
function colorPicker(o) {
  const pick = (c) => { o.color = c; drawOptsRef(); };
  const pop = el('div', { class: 'emoji-pop color-pop', role: 'dialog', 'aria-label': t('pickColor'), hidden: true },
    COLORS.map((c) => el('button', { type: 'button', class: 'swatch hl-' + c, 'aria-label': t(c), onclick: () => pick(c) })),
    el('button', { type: 'button', class: 'swatch none', 'aria-label': t('noColor'), onclick: () => pick('') }, '✕'));
  const btn = el('button', { type: 'button', class: 'small secondary ' + hlClass(o), title: t('highlightColor'), 'aria-label': t('highlightColor'),
    onclick: () => { const open = pop.hidden; closeEmoji(); pop.hidden = !open; } }, '🎨');
  return el('span', { class: 'emoji-wrap' }, btn, pop);
}

function editView(p, prev) { // prev: state kept when the language is switched
  const st = prev || {
    title: p ? p.title : '', description: p ? p.description : '', closed: p ? p.closed : false, lang: p ? p.lang : '',
    options: p ? p.options.map((o) => ({ ...o })) : [],
    logoData: null, logoRemove: false, // pending logo change, sent after the hangout is saved
  };
  useLang(st.lang);
  document.title = t('adminTitle');
  const err = el('p', { class: 'error' });

  // --- month calendar: tap days to add options ---
  const first = st.options.find((o) => o.date);
  const start = first ? new Date(first.date + 'T12:00:00') : new Date();
  let month = new Date(start.getFullYear(), start.getMonth(), 1);
  const calBox = el('div', { class: 'cal' });
  const optBox = el('div');

  // dated entries are kept in date order; text-only entries stay where the admin put them (see ↑ ↓)
  const sortOpts = () => {
    const dated = st.options.filter((o) => o.date).sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
    let k = 0;
    st.options = st.options.map((o) => (o.date ? dated[k++] : o));
  };
  const moveOpt = (i, by) => {
    const j = i + by;
    if (j < 0 || j >= st.options.length) return;
    [st.options[i], st.options[j]] = [st.options[j], st.options[i]];
    drawOpts();
  };
  // the calendar only adds (tap a day again for another entry on it); entries are removed with ✕
  const addDay = (key) => { st.options.push({ date: key, note: '' }); sortOpts(); drawCal(); drawOpts(); };
  const drawCal = () => {
    const y = month.getFullYear(), m = month.getMonth();
    const sel = new Set(st.options.map((o) => o.date));
    const today = ymd(new Date());
    const cells = [];
    for (let i = 0; i < (month.getDay() + 6) % 7; i++) cells.push(el('span'));
    for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
      const key = ymd(new Date(y, m, d));
      cells.push(el('button', { type: 'button', 'aria-label': key + (sel.has(key) ? t('hasEntries') : ''),
        class: 'day' + (sel.has(key) ? ' sel' : '') + (key === today ? ' today' : ''), onclick: () => addDay(key) }, String(d)));
    }
    const nav = (label, delta, text) => el('button', { type: 'button', class: 'secondary', 'aria-label': label,
      onclick: () => { month = new Date(y, m + delta, 1); drawCal(); } }, text);
    calBox.replaceChildren(
      el('div', { class: 'cal-head' }, nav(t('prevMonth'), -1, '‹'),
        el('strong', {}, month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })), nav(t('nextMonth'), 1, '›')),
      el('div', { class: 'cal-grid' }, [0, 1, 2, 3, 4, 5, 6].map((i) => el('span', { class: 'dow' }, new Date(2024, 0, 1 + i).toLocaleDateString(LANG, { weekday: 'short' }))), cells));
  };

  // --- selected options: add a time or note to each, or split a day into several slots ---
  const drawOpts = () => optBox.replaceChildren(...(st.options.length ? st.options.map((o, i) => {
    const note = el('input', { placeholder: t('notePlaceholder'), maxlength: 60, value: o.note, 'aria-label': t('noteLabel'), oninput: (e) => { o.note = e.target.value; } });
    return el('div', { class: 'row opt-row ' + hlClass(o) },
    el('span', { class: 'opt-date' }, o.date ? optionLabel({ date: o.date }) : t('textOnly')),
    note, emojiPicker(note), colorPicker(o),
    o.date ? null : el('span', { class: 'move' },
      el('button', { type: 'button', class: 'small secondary', 'aria-label': t('moveUp'), title: t('moveUp'), disabled: i === 0, onclick: () => moveOpt(i, -1) }, '↑'),
      el('button', { type: 'button', class: 'small secondary', 'aria-label': t('moveDown'), title: t('moveDown'), disabled: i === st.options.length - 1, onclick: () => moveOpt(i, 1) }, '↓')),
    o.date ? el('button', { type: 'button', class: 'small secondary', 'aria-label': t('addTime'),
      onclick: () => { st.options.splice(i + 1, 0, { date: o.date, note: '' }); drawOpts(); } }, '+') : null,
    el('button', { type: 'button', class: 'small secondary', 'aria-label': t('removeOption'),
      onclick: () => { st.options.splice(i, 1); drawCal(); drawOpts(); } }, '✕'));
  })
    : [el('p', { class: 'muted' }, t('tapDays'))]));
  drawOptsRef = drawOpts;
  drawCal(); drawOpts();

  // --- logo for this hangout: shown at the top of its page ---
  const logoBox = el('div');
  const drawLogo = () => {
    const cur = st.logoData || (!st.logoRemove && p && p.logo) || '';
    const file = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.svg', hidden: true, onchange: async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try { st.logoData = await scaleLogo(f); st.logoRemove = false; err.textContent = ''; drawLogo(); }
      catch (x) { err.textContent = x.logoMsg || t('imageError'); }
    } });
    logoBox.replaceChildren(
      el('label', {}, t('logo')),
      cur ? el('img', { class: 'logo', src: cur, alt: t('hangoutLogo') }) : el('p', { class: 'muted' }, t('noLogo')),
      file,
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'small secondary', onclick: () => file.click() }, cur ? t('changeLogo') : t('uploadLogo')),
        cur ? el('button', { type: 'button', class: 'small danger', onclick: () => { st.logoData = null; st.logoRemove = true; drawLogo(); } }, t('remove')) : null));
  };
  drawLogo();

  const save = async () => {
    try {
      const body = { title: st.title, description: st.description, closed: st.closed, lang: st.lang, options: st.options.filter((o) => o.date || o.note.trim()) };
      const saved = p ? await api('PUT', '/api/admin/hangouts/' + p.id, body) : await api('POST', '/api/admin/hangouts', body);
      if (st.logoData) await api('PUT', `/api/admin/hangouts/${saved.id}/logo`, { image: st.logoData });
      else if (st.logoRemove && p && p.logo) await api('DELETE', `/api/admin/hangouts/${saved.id}/logo`);
      await load();
    } catch (e) { err.textContent = e.message; }
  };

  const votes = p && p.votes.length ? el('div', { class: 'card' }, el('h2', {}, t('responses', p.votes.length)),
    p.votes.map((v) => el('div', { class: 'row spread' }, v.name,
      el('button', { class: 'small danger', onclick: async () => {
        if (!confirm(t('deleteResponse', v.name))) return;
        p = await api('DELETE', `/api/admin/hangouts/${p.id}/votes/${v.id}`); editView(p);
      } }, t('delete'))))) : null;

  show(
    el('h1', {}, p ? t('editHangout') : t('newHangout')),
    el('div', { class: 'card' },
      el('label', {}, t('language')),
      el('select', { onchange: (e) => { st.lang = e.target.value; editView(p, st); } },
        el('option', { value: '', selected: st.lang === '' }, t('auto')),
        Object.entries(LANGS).map(([k, n]) => el('option', { value: k, selected: st.lang === k }, n))),
      el('label', {}, t('title')), el('input', { maxlength: 120, value: st.title, oninput: (e) => { st.title = e.target.value; } }),
      el('label', {}, t('description')), el('textarea', { rows: 3, maxlength: 1000, oninput: (e) => { st.description = e.target.value; } }, st.description),
      logoBox,
      el('label', {}, t('dates')), calBox, optBox,
      el('button', { type: 'button', class: 'secondary small', onclick: () => { st.options.push({ date: '', note: '' }); drawOpts(); } }, t('addTextOption')),
      p ? el('label', {}, el('input', { type: 'checkbox', style: 'width:auto', checked: st.closed, onchange: (e) => { st.closed = e.target.checked; } }), t('closedCheck')) : null,
      err,
      el('div', { class: 'row' },
        el('button', { onclick: save }, t('save')),
        el('button', { class: 'secondary', onclick: load }, t('cancel')),
        p ? el('button', { class: 'danger', onclick: async () => {
          if (!confirm(t('confirmDelete'))) return;
          await api('DELETE', '/api/admin/hangouts/' + p.id); load();
        } }, t('deleteHangout')) : null)),
    votes);
}

load();
</script></body></html>
