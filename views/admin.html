<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><title>Hangout admin</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app"></main>
<script>window.BASE = '__BASE__';</script>
<script src="/common.js"></script>
<script>
const app = document.getElementById('app');
let polls = [];
let drawOptsRef = () => {}; // set by editView so colorPicker can redraw the entry list
// replaceChildren() would stringify null and arrays, so flatten and skip them
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const show = (...kids) => app.replaceChildren(...kids.flat().filter((k) => k != null));

function loginView() {
  const pw = el('input', { type: 'password', placeholder: 'Admin password', autocomplete: 'current-password', 'aria-label': 'Admin password' });
  const err = el('p', { class: 'error' });
  const go = async () => {
    try { await api('POST', '/api/login', { password: pw.value }); await load(); }
    catch (e) { err.textContent = e.message; }
  };
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  show(el('h1', {}, 'Hangout admin'),
    el('div', { class: 'card' }, pw, err, el('button', { onclick: go }, 'Log in')));
  pw.focus();
}

async function load() {
  try { polls = await api('GET', '/api/admin/polls'); listView(); }
  catch (e) { if (e.status === 401) loginView(); else app.textContent = e.message; }
}

// Raster images are scaled to fit 600x200 in the browser (keeps transparency) and returned as a data URL; SVG is passed through
async function scaleLogo(file) {
  if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) { // vector: sent as-is, the server sanitises it
    if (file.size > 200 * 1024) throw Object.assign(new Error(), { logoMsg: 'SVG too large (max 200 KB)' });
    return await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).replace(/^data:[^;]*;/, 'data:image/svg+xml;'));
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 600 / bmp.width, 200 / bmp.height);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let url = c.toDataURL('image/png');
  if (url.length > 900 * 1024) url = c.toDataURL('image/webp', 0.85);
  return url;
}

function listView() {
  show(
    el('div', { class: 'row spread' }, el('h1', {}, 'Your polls'),
      el('div', { class: 'row' },
        el('button', { onclick: () => editView(null) }, 'New poll'),
        el('button', { class: 'secondary', onclick: async () => { await api('POST', '/api/logout'); loginView(); } }, 'Log out'))),
    polls.length ? null : el('p', { class: 'muted' }, 'No polls yet.'),
    polls.map((p) => el('div', { class: 'card' },
      el('div', { class: 'row spread' },
        el('strong', {}, p.title, p.closed ? ' (closed)' : ''),
        el('span', { class: 'muted' }, p.votes.length + ' responses')),
      el('p', { class: 'link' }, el('a', { href: pollUrl(p.id), target: '_blank', rel: 'noopener' }, pollUrl(p.id))),
      el('div', { class: 'row' },
        el('button', { class: 'small', onclick: (e) => { navigator.clipboard.writeText(pollUrl(p.id)); e.target.textContent = 'Copied'; } }, 'Copy link'),
        el('button', { class: 'small secondary', onclick: () => editView(p) }, 'Edit')))));
}

const EMOJIS = ['🎉','🥳','🎂','🍕','🍔','🍝','🍣','🥗','🍻','🍷','☕','🍰','🎬','🎮','🎲','🎵','🎤','📚','⚽','🏀','🎾','🏐','🏊','🚴','🏃','🥾','⛷️','🏔️','🏖️','🌞','⛅','🌧️','❄️','🌙','🌅','🔥','⭐','❤️','👍','👋','🙂','😎','🤝','🏠','🏢','🏫','🚗','🚆','✈️','🛒','💼','🧑‍🍳','🧹','🔧','🎁','📍','⏰','📅','✅','❓'];
const closeEmoji = () => document.querySelectorAll('.emoji-pop').forEach((p) => { p.hidden = true; });
document.addEventListener('click', (e) => { if (!e.target.closest('.emoji-wrap')) closeEmoji(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEmoji(); });

// 😀 button + popover grid; inserts the chosen emoji at the cursor of the given input
function emojiPicker(input) {
  const pop = el('div', { class: 'emoji-pop', role: 'dialog', 'aria-label': 'Pick an emoji', hidden: true },
    EMOJIS.map((em) => el('button', { type: 'button', class: 'emoji', onclick: () => {
      const at = input.selectionStart == null ? input.value.length : input.selectionStart;
      input.setRangeText(em, at, input.selectionEnd == null ? at : input.selectionEnd, 'end');
      input.dispatchEvent(new Event('input'));
      pop.hidden = true;
    } }, em)));
  const btn = el('button', { type: 'button', class: 'small secondary', title: 'Insert emoji', 'aria-label': 'Insert emoji',
    onclick: () => { const open = pop.hidden; closeEmoji(); pop.hidden = !open; } }, '😀');
  return el('span', { class: 'emoji-wrap' }, btn, pop);
}

// 🎨 button + swatch popover: optional highlight colour for one entry
function colorPicker(o) {
  const pick = (c) => { o.color = c; drawOptsRef(); };
  const pop = el('div', { class: 'emoji-pop color-pop', role: 'dialog', 'aria-label': 'Pick a highlight colour', hidden: true },
    COLORS.map((c) => el('button', { type: 'button', class: 'swatch hl-' + c, 'aria-label': c, onclick: () => pick(c) })),
    el('button', { type: 'button', class: 'swatch none', 'aria-label': 'No colour', onclick: () => pick('') }, '✕'));
  const btn = el('button', { type: 'button', class: 'small secondary ' + hlClass(o), title: 'Highlight colour', 'aria-label': 'Highlight colour',
    onclick: () => { const open = pop.hidden; closeEmoji(); pop.hidden = !open; } }, '🎨');
  return el('span', { class: 'emoji-wrap' }, btn, pop);
}

function editView(p) {
  const st = {
    title: p ? p.title : '', description: p ? p.description : '', closed: p ? p.closed : false,
    options: p ? p.options.map((o) => ({ ...o })) : [],
    logoData: null, logoRemove: false, // pending logo change, sent after the poll is saved
  };
  const err = el('p', { class: 'error' });

  // --- month calendar: tap days to add options ---
  const first = st.options.find((o) => o.date);
  const start = first ? new Date(first.date + 'T12:00:00') : new Date();
  let month = new Date(start.getFullYear(), start.getMonth(), 1);
  const calBox = el('div', { class: 'cal' });
  const optBox = el('div');

  const sortOpts = () => st.options.sort((x, y) => (x.date || '9999') < (y.date || '9999') ? -1 : (x.date || '9999') > (y.date || '9999') ? 1 : 0);
  // the calendar only adds (tap a day again for another entry on it); entries are removed with ✕
  const addDay = (key) => { st.options.push({ date: key, note: '' }); sortOpts(); drawCal(); drawOpts(); };
  const drawCal = () => {
    const y = month.getFullYear(), m = month.getMonth();
    const sel = new Set(st.options.map((o) => o.date));
    const today = ymd(new Date());
    const cells = [];
    for (let i = 0; i < (month.getDay() + 6) % 7; i++) cells.push(el('span'));
    for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
      const key = ymd(new Date(y, m, d));
      cells.push(el('button', { type: 'button', 'aria-label': key + (sel.has(key) ? ' (has entries, tap to add another)' : ''),
        class: 'day' + (sel.has(key) ? ' sel' : '') + (key === today ? ' today' : ''), onclick: () => addDay(key) }, String(d)));
    }
    const nav = (label, delta, text) => el('button', { type: 'button', class: 'secondary', 'aria-label': label,
      onclick: () => { month = new Date(y, m + delta, 1); drawCal(); } }, text);
    calBox.replaceChildren(
      el('div', { class: 'cal-head' }, nav('Previous month', -1, '‹'),
        el('strong', {}, month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })), nav('Next month', 1, '›')),
      el('div', { class: 'cal-grid' }, ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((n) => el('span', { class: 'dow' }, n)), cells));
  };

  // --- selected options: add a time or note to each, or split a day into several slots ---
  const drawOpts = () => optBox.replaceChildren(...(st.options.length ? st.options.map((o, i) => {
    const note = el('input', { placeholder: 'Time / note (e.g. 18:00)', maxlength: 60, value: o.note, 'aria-label': 'Time or note', oninput: (e) => { o.note = e.target.value; } });
    return el('div', { class: 'row opt-row ' + hlClass(o) },
    el('span', { class: 'opt-date' }, o.date ? optionLabel({ date: o.date }) : 'Text only'),
    note, emojiPicker(note), colorPicker(o),
    o.date ? el('button', { type: 'button', class: 'small secondary', 'aria-label': 'Add another time on this day',
      onclick: () => { st.options.splice(i + 1, 0, { date: o.date, note: '' }); drawOpts(); } }, '+') : null,
    el('button', { type: 'button', class: 'small secondary', 'aria-label': 'Remove option',
      onclick: () => { st.options.splice(i, 1); drawCal(); drawOpts(); } }, '✕'));
  })
    : [el('p', { class: 'muted' }, 'Tap days in the calendar to add them.')]));
  drawOptsRef = drawOpts;
  drawCal(); drawOpts();

  // --- logo for this poll: shown at the top of its page ---
  const logoBox = el('div');
  const drawLogo = () => {
    const cur = st.logoData || (!st.logoRemove && p && p.logo) || '';
    const file = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif,image/svg+xml,.svg', hidden: true, onchange: async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try { st.logoData = await scaleLogo(f); st.logoRemove = false; err.textContent = ''; drawLogo(); }
      catch (x) { err.textContent = x.logoMsg || 'Could not read that image'; }
    } });
    logoBox.replaceChildren(
      el('label', {}, 'Logo'),
      cur ? el('img', { class: 'logo', src: cur, alt: 'Poll logo' }) : el('p', { class: 'muted' }, 'No logo. It is shown at the top of this poll.'),
      file,
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'small secondary', onclick: () => file.click() }, cur ? 'Change logo' : 'Upload logo'),
        cur ? el('button', { type: 'button', class: 'small danger', onclick: () => { st.logoData = null; st.logoRemove = true; drawLogo(); } }, 'Remove') : null));
  };
  drawLogo();

  const save = async () => {
    try {
      const body = { title: st.title, description: st.description, closed: st.closed, options: st.options.filter((o) => o.date || o.note.trim()) };
      const saved = p ? await api('PUT', '/api/admin/polls/' + p.id, body) : await api('POST', '/api/admin/polls', body);
      if (st.logoData) await api('PUT', `/api/admin/polls/${saved.id}/logo`, { image: st.logoData });
      else if (st.logoRemove && p && p.logo) await api('DELETE', `/api/admin/polls/${saved.id}/logo`);
      await load();
    } catch (e) { err.textContent = e.message; }
  };

  const votes = p && p.votes.length ? el('div', { class: 'card' }, el('h2', {}, 'Responses'),
    p.votes.map((v) => el('div', { class: 'row spread' }, v.name,
      el('button', { class: 'small danger', onclick: async () => {
        if (!confirm('Delete response from ' + v.name + '?')) return;
        p = await api('DELETE', `/api/admin/polls/${p.id}/votes/${v.id}`); editView(p);
      } }, 'Delete')))) : null;

  show(
    el('h1', {}, p ? 'Edit poll' : 'New poll'),
    el('div', { class: 'card' },
      el('label', {}, 'Title'), el('input', { maxlength: 120, value: st.title, oninput: (e) => { st.title = e.target.value; } }),
      el('label', {}, 'Description'), el('textarea', { rows: 3, maxlength: 1000, oninput: (e) => { st.description = e.target.value; } }, st.description),
      logoBox,
      el('label', {}, 'Dates'), calBox, optBox,
      el('button', { type: 'button', class: 'secondary small', onclick: () => { st.options.push({ date: '', note: '' }); drawOpts(); } }, '+ Add text-only option'),
      p ? el('label', {}, el('input', { type: 'checkbox', style: 'width:auto', checked: st.closed, onchange: (e) => { st.closed = e.target.checked; } }), ' Closed (no new responses)') : null,
      err,
      el('div', { class: 'row' },
        el('button', { onclick: save }, 'Save'),
        el('button', { class: 'secondary', onclick: load }, 'Cancel'),
        p ? el('button', { class: 'danger', onclick: async () => {
          if (!confirm('Delete this poll and all responses?')) return;
          await api('DELETE', '/api/admin/polls/' + p.id); load();
        } }, 'Delete poll') : null)),
    votes);
}

load();
</script></body></html>
